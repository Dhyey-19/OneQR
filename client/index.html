<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Premium SEO Meta Tags -->
    <title>OneQR — Next-Gen Business Identity & Smart NFC/QR Platform</title>
    <meta name="description" content="Create premium interactive digital profile landing cards, customized laser-engraved NFC business cards, and dynamic smart QR standees with real-time cloud telemetry insights." />
    <meta name="keywords" content="NFC business card, smart QR profile, digital business card, SaaS dashboard, lead capture, hospitality QR menu, real-time analytics" />
    <meta name="author" content="OneQR Inc." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oneqr.co/" />
    <meta property="og:title" content="OneQR — Next-Gen Business Identity & Smart NFC/QR Platform" />
    <meta property="og:description" content="Host custom-designed profile pages with instant links and dynamic widgets. Share contact cards, catalogs, and capture leads instantly in one tap." />
    <meta property="og:image" content="https://oneqr.co/og-cover.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://oneqr.co/" />
    <meta property="twitter:title" content="OneQR — Next-Gen Business Identity & Smart NFC/QR Platform" />
    <meta property="twitter:description" content="Host custom-designed profile pages with instant links and dynamic widgets. Share contact cards, catalogs, and capture leads instantly in one tap." />
    
    <!-- Preconnect Google Fonts for speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Theme preference check script (avoids flash of incorrect theme) -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('oneqr_theme');
        const isDark = savedTheme ? savedTheme === 'dark' : true;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#030712] dark:text-slate-100 antialiased overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
